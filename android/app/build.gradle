plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketcode.ide'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pocketcode.ide'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
